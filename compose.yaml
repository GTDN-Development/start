services:
  pocketbase:
    build:
      context: ./apps/pocketbase
    environment:
      PORT: 8080
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-local-admin@example.com}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-local-dev-password}
      PB_SEED_LAYOUT_BANNER_DEMO: ${PB_SEED_LAYOUT_BANNER_DEMO:-false}
      WEB_INTERNAL_API_SECRET: ${WEB_INTERNAL_API_SECRET:-local-internal-secret}
      GENERAL_FORMS_RECIPIENT: ${GENERAL_FORMS_RECIPIENT:-hello@example.com}
    ports:
      - "${POCKETBASE_PORT:-8090}:8080"
    volumes:
      - pocketbase_data:/pb_data

  mailpit:
    build:
      context: ./infra/mailpit
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  gotenberg:
    build:
      context: ./infra/gotenberg
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3031}:3000"

volumes:
  pocketbase_data:
